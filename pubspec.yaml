name: j_flutter_ui
description: "This UI library is designed to provide reusable shared widgets."
publish_to: 'none'
version: 2.8.1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  auto_size_text: ^3.0.0
  flutter_html: ^3.0.0
  # flutter_html 3.0.0 calls a function that html 0.15.7 removed, so any app
  # that resolves 0.15.7 fails to compile. Capping it here reaches every
  # consuming app. Lift the cap when flutter_html ships a fix, or when
  # flutter_html leaves this package.
  html: ">=0.15.5 <0.15.7"
  flutter_svg: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/flags/svg/
    - assets/illustrations/svg/
    - assets/images/png/
    - assets/images/jpg/
    - assets/images/svg/
    - assets/localization/

license: MIT
